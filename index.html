  <body style="font-family: sans-serif; padding: 2rem">
    <h1>This is for testing purpose</h1>

    <button onclick="createPerson()">Create Person</button>
    <button onclick="welcome()">Click Me</button>
    <button onclick="logoutPerson()">Reset / Logout</button>

    <p id="status"></p>

    <script>
      function createPerson() {
        posthog.identify("user_101", {
          email: "alex@example.com",
          name: "Alex",
          plan: "pro",
        });
        document.getElementById("status").innerText =
          "Identified person: user_101 (alex@example.com)";
        console.log("Person identified!");
      }

      function welcome() {
        console.log("Hi, Welcome");
        posthog.capture("welcome_button_clicked", {
          source: "test_page",
        });
        document.getElementById("status").innerText =
          "Sent event: welcome_button_clicked";
      }

      function logoutPerson() {
        posthog.reset();
        document.getElementById("status").innerText =
          "PostHog session reset (anonymous again)";
        console.log("Session reset!");
      }
    </script>
  </body>
